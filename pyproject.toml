[project]
name = "genai-search-with-duckduckgo-and-tavily"
version = "0.1.0"
description = "Jupyter notebook demo: LLM tool use via LangChain/OpenRouter, with DuckDuckGo search and Tavily fallback"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain-openai>=0.2.0",
    "python-dotenv>=1.0.1",
    "langchain-community>=0.4.2",
    "langchain-tavily>=0.2.18",
    "ddgs>=9.16.0",
]

[dependency-groups]
dev = [
    "jupyterlab>=4.6.3",
    "pytest>=9.1.1",
]
