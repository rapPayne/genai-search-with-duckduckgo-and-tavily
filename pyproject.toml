[project]
name = "genai-search-with-duckduckgo-and-tavily"
version = "0.1.0"
description = "Jupyter notebook demo for DuckDuckGo search with Tavily fallback"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckduckgo-search>=8.1.1",
    "tavily-python>=0.8.3",
]

[dependency-groups]
dev = [
    "jupyterlab>=4.6.3",
]
